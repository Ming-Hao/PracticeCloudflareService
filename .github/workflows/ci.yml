name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      # Overlaps with the step above: npm run build is run-p type-check build-only, so
      # vue-tsc runs a second time here. Type check stays separate so a type error shows
      # up under its own name, and --build is incremental, so the repeat reads
      # .tsbuildinfo and costs almost nothing.
      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test