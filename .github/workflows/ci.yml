name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ahead of the type check because that step's result assumes this file is current:
      # types generated from an older wrangler.toml still pass, they just describe
      # bindings that no longer exist. Needs no Cloudflare credentials — it compares the
      # header hash against what the local config and workerd version produce now.
      # Telemetry defaults to on: with WRANGLER_SEND_METRICS unset, wrangler falls back
      # through wrangler.toml and the machine's own setting to "send", and a fresh runner
      # has neither. Forcing it false below is what keeps this step off the network.
      - name: Check generated Workers types
        run: npm run wrangler:types:check
        env:
          WRANGLER_SEND_METRICS: false

      - name: Type check
        run: npm run type-check

      # Overlaps with the step above: npm run build is run-p type-check build-only, so
      # vue-tsc runs a second time here. Type check stays separate so a type error shows
      # up under its own name, and --build is incremental, so the repeat reads
      # .tsbuildinfo and costs almost nothing.
      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test